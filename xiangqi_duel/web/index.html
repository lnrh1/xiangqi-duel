<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>象棋对弈 · Xiangqi Duel</title>
<style>
  :root {
    --bg: #17130f;
    --panel: #221c16;
    --panel-2: #2b241c;
    --line: #3a2f24;
    --text: #f2e8da;
    --muted: #a89883;
    --accent: #d9a441;
    --red: #e0533f;
    --black: #9fb4c9;
    --board: #e9c98f;
    --board-line: #8a6435;
    --ok: #74c69d;
    --error: #ef7867;
    --glyph: 22px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 20% -10%, #2c241b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 26px 10px; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #f6e3c2, #d9b477);
    color: #a9271b; font-weight: 800; font-size: 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  h1 { margin: 0; font-size: 21px; letter-spacing: .06em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .top-actions { display: flex; gap: 10px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: .18s;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.primary { background: linear-gradient(160deg, #e0b25c, #bf8a2f); border-color: transparent; color: #221a10; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.big { padding: 12px 26px; font-size: 16px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .layout {
    display: grid; grid-template-columns: minmax(320px, 640px) minmax(300px, 420px);
    gap: 26px; justify-content: center; align-items: start;
    padding: 10px 26px 40px;
  }
  .board-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .board {
    position: relative; width: min(66vh, 100%); aspect-ratio: 8 / 9;
    background: linear-gradient(150deg, #f0d6a4, var(--board) 55%, #dcb87a);
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .grid { position: absolute; inset: 6.5%; }
  #board-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #board-svg line { stroke: var(--board-line); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  #board-svg line.edge { stroke-width: 2.4; }
  #board-svg text { fill: rgba(120,84,40,.85); font-size: .42px; font-weight: 700; letter-spacing: .18px; text-anchor: middle; }
  .pieces, .markers { position: absolute; inset: 0; }
  .piece {
    position: absolute; width: 11.4%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
    font-size: var(--glyph); font-weight: 800; user-select: none; z-index: 3;
    transition: left .2s ease, top .2s ease, box-shadow .2s ease, transform .12s ease;
    cursor: default;
  }
  .piece.red {
    background: radial-gradient(circle at 32% 28%, #fff7ea, #f0d6ae 70%);
    color: #b3261e; border: 2px solid #b3261e;
    box-shadow: 0 3px 8px rgba(60,20,10,.4), inset 0 0 0 3px rgba(179,38,30,.14);
  }
  .piece.black {
    background: radial-gradient(circle at 32% 28%, #f4f4f4, #d9d9d9 70%);
    color: #1d1d1f; border: 2px solid #1d1d1f;
    box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 0 0 3px rgba(0,0,0,.12);
  }
  .piece.selected { transform: translate(-50%, -50%) scale(1.07); box-shadow: 0 0 0 4px var(--accent), 0 6px 16px rgba(0,0,0,.45); }
  .piece.movable { cursor: pointer; }
  .marker {
    position: absolute; width: 3.4%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); background: rgba(34, 110, 66, .8); z-index: 2;
    box-shadow: 0 0 0 2px rgba(255,255,255,.35);
  }
  .marker.capture { background: transparent; box-shadow: 0 0 0 3px rgba(190, 40, 30, .85); width: 10.6%; }
  .lastmove {
    position: absolute; width: 12.6%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border: 2px dashed rgba(160, 96, 20, .75); border-radius: 8px; z-index: 1;
  }
  .legend {
    display: flex; align-items: center; gap: 10px; width: min(66vh, 100%);
    color: var(--muted); font-size: 13px; flex-wrap: wrap;
  }
  .legend .spacer { flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.red { background: var(--red); }
  .dot.black { background: var(--black); }
  .dot.think { animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .side {
    background: linear-gradient(180deg, var(--panel), #1d1813);
    border: 1px solid var(--line); border-radius: 18px; padding: 16px;
    display: flex; flex-direction: column; gap: 14px; min-height: 420px;
  }
  .players { display: grid; gap: 10px; }
  .player {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 12px; background: var(--panel-2); border: 1px solid transparent;
  }
  .player.active { border-color: var(--accent); background: #33291d; }
  .player .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 17px; flex: none;
    background: #f0d6ae; color: #b3261e; border: 2px solid #b3261e;
  }
  .player.black .avatar { background: #d9d9d9; color: #1d1d1f; border-color: #1d1d1f; }
  .player .meta { min-width: 0; }
  .player .meta strong { display: block; font-size: 14px; }
  .player .meta span { color: var(--muted); font-size: 12px; }
  .player .usage { margin-left: auto; text-align: right; color: var(--muted); font-size: 11px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; color: var(--muted); padding: 9px 12px;
    cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab.hidden { display: none; }
  .pane { display: none; flex-direction: column; min-height: 200px; }
  .pane.active { display: flex; }
  .moves { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 46vh; }
  .moves li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
  .moves li:nth-child(odd) { background: rgba(255,255,255,.02); }
  .moves .ply { color: var(--muted); width: 30px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .moves .notation { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 16px; }
  .moves .note { color: var(--muted); font-size: 12px; margin-left: auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 42vh; padding: 6px 2px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg.red { border-left: 3px solid var(--red); }
  .msg.black { border-left: 3px solid var(--black); }
  .msg.user { align-self: flex-end; background: #3a2f22; border-right: 3px solid var(--accent); }
  .chat-form { display: flex; gap: 8px; margin-top: 10px; }
  .chat-form input {
    flex: 1; background: #191410; border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 10px; outline: none;
  }
  .chat-form input:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .hint.error { color: var(--error); }
  .trace { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 52vh; padding: 6px 2px; }
  .trace-item { border-left: 3px solid var(--line); padding: 8px 12px; background: rgba(255,255,255,.025); border-radius: 0 10px 10px 0; font-size: 13px; }
  .trace-item.red { border-left-color: var(--red); }
  .trace-item.black { border-left-color: var(--black); }
  .trace-item.error { border-left-color: var(--error); }
  .trace-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .trace-kind { color: var(--muted); font-size: 12px; }
  .trace-kind.tool { color: var(--accent); font-weight: 600; }
  .trace-text { white-space: pre-wrap; line-height: 1.55; }
  .trace-result { color: var(--muted); font-size: 12px; margin-top: 5px; white-space: pre-wrap; word-break: break-all; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .chip.red { background: rgba(224, 83, 63, .16); color: #ffb4a8; }
  .chip.black { background: rgba(159, 180, 201, .16); color: #cfe0f0; }
  .chip.you { background: rgba(217, 164, 65, .18); color: #f5d28a; }
  .result-banner {
    margin: 4px 0 0; padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 700;
    background: linear-gradient(160deg, rgba(217,164,65,.18), rgba(217,164,65,.06));
    border: 1px solid rgba(217,164,65,.45);
  }
  .result-banner span { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 6, 4, .72); backdrop-filter: blur(3px);
    display: grid; place-items: center; z-index: 50; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .setup {
    width: min(760px, 100%); max-height: 90vh; overflow-y: auto;
    background: linear-gradient(180deg, #262019, #1c1712);
    border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .setup-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .setup h2 { margin: 0; font-size: 19px; }
  .setup h3 { margin: 0; font-size: 15px; }
  .setup-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .model-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .model-row {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px;
    background: var(--panel-2); border-radius: 10px; font-size: 13px;
  }
  .model-row .name { font-weight: 600; margin-right: 8px; }
  .model-row .sub { color: var(--muted); font-size: 12px; }
  .model-row .actions { margin-left: auto; display: flex; gap: 6px; }
  .model-row .actions button { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .model-row .test-ok { color: var(--ok); font-size: 12px; }
  .model-row .test-bad { color: var(--error); font-size: 12px; }
  .add-model { display: grid; grid-template-columns: 152px 1.2fr 1.2fr .9fr auto; gap: 8px; margin-top: 12px; }
  .add-model input, .add-model select, .side-config input, .side-config select {
    background: #191410; border: 1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: 9px; outline: none; min-width: 0;
  }
  .add-model input:focus, .add-model select:focus, .side-config select:focus { border-color: var(--accent); }
  .side-config { display: grid; grid-template-columns: 1fr 1fr 130px; gap: 12px; }
  .side-config label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .setup-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  @media (max-width: 940px) {
    .layout { grid-template-columns: 1fr; padding: 10px 14px 30px; }
    .board { width: min(88vw, 560px); }
    .legend { width: min(88vw, 560px); }
    .side { min-height: 0; }
    .add-model { grid-template-columns: 1fr 1fr; }
    .side-config { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">帥</div>
    <div>
      <h1>象棋对弈 · Xiangqi Duel</h1>
      <p id="subtitle">双 AI 对弈，实时观战</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="btn-new" class="btn primary">新对局</button>
    <button id="btn-stop" class="btn">停止</button>
  </div>
</header>

<main class="layout">
  <section class="board-panel">
    <div class="board" id="board">
      <div class="grid" id="grid">
        <svg id="board-svg" viewBox="0 0 8 9" preserveAspectRatio="none"></svg>
        <div class="markers" id="markers"></div>
        <div class="pieces" id="pieces"></div>
      </div>
    </div>
    <div class="legend">
      <span class="dot" id="turn-dot"></span>
      <span id="turn-text">等待开始</span>
      <span id="check-text"></span>
      <span class="spacer"></span>
      <span id="material-text"></span>
    </div>
  </section>

  <aside class="side">
    <div class="players" id="players"></div>
    <div class="tabs">
      <button class="tab active" data-tab="moves">棋谱</button>
      <button class="tab" data-tab="chat">对话</button>
      <button class="tab" data-tab="trace" id="tab-trace">思考 / 工具</button>
    </div>
    <div id="pane-moves" class="pane active"><ol class="moves" id="move-list"></ol></div>
    <div id="pane-chat" class="pane">
      <div class="chat" id="chat-list"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" placeholder="对 AI 说点什么…" autocomplete="off">
        <button class="btn primary" type="submit">发送</button>
      </form>
      <p class="hint" id="chat-hint"></p>
    </div>
    <div id="pane-trace" class="pane"><div class="trace" id="trace-list"></div></div>
  </aside>
</main>

<div class="overlay hidden" id="setup">
  <div class="setup">
    <div class="setup-head">
      <h2>开始新对局</h2>
      <button class="btn ghost" id="setup-close">关闭</button>
    </div>

    <section class="setup-section">
      <div class="section-head">
        <h3>① 模型库</h3>
        <span class="hint">API Key 只保存在本机服务器，界面不会回显</span>
      </div>
      <div class="model-list" id="model-list"></div>
      <div class="add-model">
        <select id="add-provider"></select>
        <input id="add-model" placeholder="模型名，如 deepseek-chat">
        <input id="add-key" type="password" placeholder="API Key">
        <input id="add-label" placeholder="备注（可选）">
        <button class="btn" id="btn-add-model">添加</button>
      </div>
      <p class="hint" id="add-result"></p>
    </section>

    <section class="setup-section">
      <div class="section-head">
        <h3>② 对局设置</h3>
        <span class="hint">选手与模型解耦：每个座位从模型库里挑一个</span>
      </div>
      <div class="side-config">
        <label>红方（先行）<select id="red-select"></select></label>
        <label>黑方<select id="black-select"></select></label>
        <label>最大手数<input id="max-plies" type="number" value="300" min="20" max="1000"></label>
      </div>
      <p class="hint">两边都选 AI = 观战模式（可见双方思考与工具调用）；任一边选“人类” = 人机对弈。</p>
    </section>

    <div class="setup-actions">
      <button class="btn primary big" id="btn-start">开始对局</button>
    </div>
    <p class="hint error" id="setup-error"></p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    models: [],
    providers: [],
    snapshot: null,
    selected: null,
    tab: 'moves',
    es: null,
    lastPly: -1,
    pollTimer: null,
    staticMode: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var redSelect, blackSelect, grid, piecesLayer, markersLayer;

  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function toast(message) {
    var hint = $('setup-error');
    hint.textContent = message || '';
    if (message) { hint.classList.add('error'); }
  }

  async function api(url, options) {
    options = options || {};
    var init = { method: options.method || 'GET', headers: { 'Content-Type': 'application/json' } };
    if (options.body !== undefined) { init.body = JSON.stringify(options.body); }
    var response = await fetch(url, init);
    var data = {};
    try { data = await response.json(); } catch (err) { data = {}; }
    if (!response.ok) {
      throw new Error((data && data.error) || ('HTTP ' + response.status));
    }
    return data;
  }

  // ---------------------------------------------------------------- board svg
  function drawGrid() {
    var svg = $('board-svg');
    var NS = 'http://www.w3.org/2000/svg';
    var svgLines = [];
    function line(x1, y1, x2, y2, cls) {
      var el = document.createElementNS(NS, 'line');
      el.setAttribute('x1', x1); el.setAttribute('y1', y1);
      el.setAttribute('x2', x2); el.setAttribute('y2', y2);
      if (cls) { el.setAttribute('class', cls); }
      svgLines.push(el);
    }
    for (var x = 0; x <= 8; x += 1) {
      if (x === 0 || x === 8) { line(x, 0, x, 9, 'edge'); }
      else { line(x, 0, x, 4, ''); line(x, 5, x, 9, ''); }
    }
    for (var y = 0; y <= 9; y += 1) { line(0, y, 8, y, y === 0 || y === 9 ? 'edge' : ''); }
    line(3, 0, 5, 2, ''); line(5, 0, 3, 2, '');
    line(3, 7, 5, 9, ''); line(5, 7, 3, 9, '');
    svgLines.forEach(function (el) { svg.appendChild(el); });
    var t1 = document.createElementNS(NS, 'text');
    t1.setAttribute('x', 2); t1.setAttribute('y', 4.63);
    t1.textContent = '楚 河';
    svg.appendChild(t1);
    var t2 = document.createElementNS(NS, 'text');
    t2.setAttribute('x', 6); t2.setAttribute('y', 4.63);
    t2.textContent = '汉 界';
    svg.appendChild(t2);
  }

  function fitBoard() {
    var g = $('grid');
    var cell = g.clientWidth / 8;
    document.documentElement.style.setProperty('--glyph', Math.max(12, Math.round(cell * 0.56)) + 'px');
  }

  // ---------------------------------------------------------------- rendering
  function applySnapshot(snap) {
    state.snapshot = snap;
    if (!snap) { return; }
    renderBoard(snap);
    renderStatus(snap);
    renderPlayers(snap);
    renderMoves(snap);
    renderChat(snap);
    renderTrace(snap);
    var traceTab = $('tab-trace');
    if (snap.mode === 'human') { traceTab.classList.add('hidden'); }
    else { traceTab.classList.remove('hidden'); }
    var chatInput = $('chat-input');
    var hint = $('chat-hint');
    if (snap.mode === 'human') {
      chatInput.disabled = false;
      hint.textContent = '你的留言会在 AI 下一回合被读到；它可以用 send_message 回复你。';
    } else {
      chatInput.disabled = true;
      hint.textContent = '观战模式：双方 AI 的对话会出现在这里，你不能插话。';
    }
  }

  function topFor(y) { return (9 - y) / 9 * 100; }
  function leftFor(x) { return x / 8 * 100; }

  function renderBoard(snap) {
    var layer = piecesLayer;
    var seen = {};
    (snap.pieces || []).forEach(function (piece) {
      seen[piece.id] = true;
      var el = layer.querySelector('[data-id="' + piece.id + '"]');
      if (!el) {
        el = document.createElement('div');
        el.setAttribute('data-id', piece.id);
        el.appendChild(document.createElement('span'));
        layer.appendChild(el);
      }
      el.className = 'piece ' + piece.color + (state.selected === piece.id ? ' selected' : '');
      el.firstChild.textContent = piece.glyph;
      el.style.left = leftFor(piece.x) + '%';
      el.style.top = topFor(piece.y) + '%';
      el.dataset.square = piece.square;
      el.dataset.color = piece.color;
    });
    var children = layer.querySelectorAll('.piece');
    for (var i = 0; i < children.length; i += 1) {
      if (!seen[children[i].getAttribute('data-id')]) { children[i].remove(); }
    }
    renderMarkers(snap);
  }

  function renderMarkers(snap) {
    markersLayer.innerHTML = '';
    var moves = snap.moves || [];
    var last = moves.length ? moves[moves.length - 1] : null;
    if (last) {
      [last.from, last.to].forEach(function (name) {
        var x = 'abcdefghi'.indexOf(name.charAt(0));
        var y = parseInt(name.slice(1), 10);
        var box = document.createElement('div');
        box.className = 'lastmove';
        box.style.left = leftFor(x) + '%';
        box.style.top = topFor(y) + '%';
        markersLayer.appendChild(box);
      });
    }
    var legal = (snap.legal || {})[state.selected];
    if (legal) {
      legal.forEach(function (name) {
        var x = 'abcdefghi'.indexOf(name.charAt(0));
        var y = parseInt(name.slice(1), 10);
        var dot = document.createElement('div');
        var occupied = (snap.pieces || []).some(function (p) { return p.square === name; });
        dot.className = 'marker' + (occupied ? ' capture' : '');
        dot.style.left = leftFor(x) + '%';
        dot.style.top = topFor(y) + '%';
        markersLayer.appendChild(dot);
      });
    }
    var mine = snap.mode === 'human' && snap.turn === snap.human_side && snap.status === 'playing';
    var pieceEls = piecesLayer.querySelectorAll('.piece');
    for (var i = 0; i < pieceEls.length; i += 1) {
      var isMine = mine && pieceEls[i].dataset.color === snap.human_side;
      if (isMine) { pieceEls[i].classList.add('movable'); }
      else { pieceEls[i].classList.remove('movable'); }
    }
  }

  function renderStatus(snap) {
    var dot = $('turn-dot');
    var text = $('turn-text');
    var check = $('check-text');
    var material = $('material-text');
    dot.className = 'dot';
    check.textContent = '';
    if (snap.status === 'playing') {
      dot.classList.add(snap.turn === 'red' ? 'red' : 'black');
      if (snap.thinking) { dot.classList.add('think'); }
      var who = snap.turn === 'red' ? '红方' : '黑方';
      if (snap.mode === 'human' && snap.turn === snap.human_side) {
        text.textContent = '轮到你（' + who + '）走棋';
      } else if (snap.thinking) {
        text.textContent = who + '正在思考…';
      } else {
        text.textContent = '轮到' + who + '走棋';
      }
      check.textContent = snap.check ? '· 将军！' : '';
      material.textContent = '子力  红 ' + snap.material.red + ' / 黑 ' + snap.material.black;
    } else {
      var result = snap.result || {};
      var winner = result.winner ? (result.winner === 'red' ? '红方' : '黑方') : '和棋';
      var reasonZh = {
        'checkmate': '将死',
        'stalemate': '困毙',
        'perpetual check': '长将判负',
        'threefold repetition': '三次重复局面判和',
        'sixty-move rule': '60 回合无吃子判和',
        'insufficient material': '子力不足判和',
        'move limit': '达到最大手数'
      }[result.reason] || result.reason;
      text.textContent = '对局结束：' + (winner === '和棋' ? '和棋' : winner + '胜');
      check.textContent = '· ' + (reasonZh || '');
      material.textContent = '共 ' + snap.ply + ' 手';
    }
  }

  function renderPlayers(snap) {
    var html = '';
    ['red', 'black'].forEach(function (side) {
      var info = (snap.players || {})[side] || {};
      var label = info.label || (side === 'red' ? '红方' : '黑方');
      var kind;
      if (info.kind === 'human') { kind = '人类棋手'; }
      else if (info.kind === 'engine') { kind = '离线 alpha-beta 引擎 · 深度 ' + (info.depth || 3); }
      else { kind = info.provider + ' · ' + info.model; }
      var active = snap.status === 'playing' && snap.turn === side ? ' active' : '';
      var usage = (snap.usage || {})[side] || {};
      var tokens = (usage.input || 0) + (usage.output || 0);
      html += '<div class="player ' + side + active + '">' +
        '<div class="avatar">' + (side === 'red' ? '帥' : '將') + '</div>' +
        '<div class="meta"><strong>' + esc(label) + '</strong><span>' + esc(kind) + '</span></div>' +
        '<div class="usage">' + (tokens ? tokens + ' tokens' : '') + '</div>' +
        '</div>';
    });
    $('players').innerHTML = html;
  }

  function sideLabel(side) {
    if (side === 'red') { return '红方'; }
    if (side === 'black') { return '黑方'; }
    return '你';
  }

  function renderMoves(snap) {
    var list = $('move-list');
    var moves = snap.moves || [];
    var html = '';
    moves.forEach(function (move) {
      var side = move.side === 'red' ? '红' : '黑';
      html += '<li><span class="ply">' + move.ply + '</span>' +
        '<span class="chip ' + move.side + '">' + side + '</span>' +
        '<span class="notation">' + esc(move.notation) + (move.capture ? ' 吃' : '') + '</span>' +
        (move.comment && snap.mode === 'aivai' ? '<span class="note">' + esc(move.comment) + '</span>' : '') +
        '</li>';
    });
    if (!moves.length) { html = '<li><span class="empty">还没有着法</span></li>'; }
    list.innerHTML = html;
    list.scrollTop = list.scrollHeight;
  }

  function renderChat(snap) {
    var list = $('chat-list');
    var html = '';
    (snap.chat || []).forEach(function (message) {
      var side = message.side;
      var cls = side === 'user' ? 'user' : side;
      var who = side === 'user' ? '你' : (side === 'red' ? '红方' : '黑方');
      html += '<div class="msg ' + cls + '"><span class="who">' + who + '</span>' + esc(message.text) + '</div>';
    });
    if (!html) { html = '<p class="empty">还没有人说话。AI 可以用 send_message 留言。</p>'; }
    list.innerHTML = html;
    list.scrollTop = list.scrollHeight;
  }

  function traceItemHtml(entry) {
    var side = entry.side === 'red' ? 'red' : 'black';
    var who = entry.side === 'red' ? '红方' : '黑方';
    if (entry.kind === 'thinking') {
      return '<div class="trace-item ' + side + '"><div class="trace-head">' +
        '<span class="chip ' + side + '">' + who + '</span>' +
        '<span class="trace-kind">' + (entry.variant === 'reasoning' ? '推理' : '思路') + '</span></div>' +
        '<div class="trace-text">' + esc(entry.text) + '</div></div>';
    }
    if (entry.kind === 'tool_call') {
      var args = '';
      try { args = JSON.stringify(entry.arguments || {}); } catch (err) { args = ''; }
      return '<div class="trace-item ' + side + '"><div class="trace-head">' +
        '<span class="chip ' + side + '">' + who + '</span>' +
        '<span class="trace-kind tool">' + esc(entry.name) + '</span></div>' +
        '<div class="trace-text mono">' + esc(args) + '</div>' +
        (entry.result ? '<div class="trace-result mono">' + esc(entry.result) + '</div>' : '') + '</div>';
    }
    if (entry.kind === 'error') {
      return '<div class="trace-item error"><div class="trace-head"><span class="trace-kind">错误</span></div>' +
        '<div class="trace-text">' + esc(entry.text) + '</div></div>';
    }
    return '';
  }

  function renderTrace(snap) {
    var list = $('trace-list');
    var entries = (snap.trace || []).filter(function (e) { return e.kind !== 'llm_step'; });
    if (!entries.length) {
      list.innerHTML = '<p class="empty">' + (snap.mode === 'human' ? '人机对弈中，AI 的思考与工具调用对你不可见。' : '等待 AI 落子…') + '</p>';
      return;
    }
    list.innerHTML = entries.map(traceItemHtml).join('');
    list.scrollTop = list.scrollHeight;
  }

  function addTrace(entry) {
    var snap = state.snapshot;
    if (!snap || snap.mode !== 'aivai') { return; }
    snap.trace = snap.trace || [];
    var exists = snap.trace.some(function (e) { return e.id === entry.id; });
    if (exists) { return; }
    snap.trace.push(entry);
    if (snap.trace.length > 200) { snap.trace.shift(); }
    renderTrace(snap);
  }

  // ---------------------------------------------------------------- human moves
  function handleSquare(name) {
    var snap = state.snapshot;
    if (!snap || snap.mode !== 'human' || snap.status !== 'playing' || snap.turn !== snap.human_side) { return; }
    var legal = (snap.legal || {})[state.selected];
    if (state.selected && legal && legal.indexOf(name) !== -1) {
      sendMove(state.selected, name);
      return;
    }
    var piece = (snap.pieces || []).filter(function (p) { return p.square === name; })[0];
    if (piece && piece.color === snap.human_side) {
      state.selected = piece.id;
      renderBoard(snap);
      return;
    }
    state.selected = null;
    renderBoard(snap);
  }

  async function sendMove(pieceId, to) {
    try {
      await api('/api/move', { method: 'POST', body: { piece_id: pieceId, to: to } });
      state.selected = null;
    } catch (err) {
      toast(err.message);
    }
  }

  // ------------------------------------------------------------------- setup
  function fillProviderSelect() {
    var select = $('add-provider');
    var html = '';
    state.providers.forEach(function (provider) {
      if (provider.name === 'engine') { return; }
      html += '<option value="' + provider.name + '">' + provider.name + (provider.model ? '（' + provider.model + '）' : '') + '</option>';
    });
    html += '<option value="custom">自定义 base_url</option>';
    select.innerHTML = html;
    if (select.value) { updateModelPlaceholder(); }
  }

  function updateModelPlaceholder() {
    var name = $('add-provider').value;
    var provider = state.providers.filter(function (p) { return p.name === name; })[0];
    var input = $('add-model');
    if (provider) { input.value = provider.model || ''; input.placeholder = provider.model || '模型名'; }
    else { input.placeholder = '模型名'; }
  }

  function renderModelList() {
    var list = $('model-list');
    if (!state.models.length) {
      list.innerHTML = '<p class="empty">模型库是空的。先在下面填一个提供商 + API Key。</p>';
      return;
    }
    var html = '';
    state.models.forEach(function (model) {
      html += '<div class="model-row" data-model="' + model.id + '">' +
        '<div><span class="name">' + esc(model.label) + '</span>' +
        '<span class="sub">' + esc(model.provider + ' · ' + model.model) +
        (model.has_key ? '' : ' · <b>缺少 Key</b>') + '</span></div>' +
        '<div class="actions">' +
        '<button class="btn" data-test="' + model.id + '">测试</button>' +
        '<button class="btn" data-del="' + model.id + '">删除</button>' +
        '</div><span class="test-slot"></span></div>';
    });
    list.innerHTML = html;
  }

  function fillPlayerSelects() {
    function optionsHtml(selected) {
      var html = '<option value="engine">本地引擎（离线，无需 API）</option>';
      html += '<option value="human">人类（我来下）</option>';
      state.models.forEach(function (model) {
        html += '<option value="model:' + model.id + '">' + esc(model.label) +
          (model.has_key ? '' : '（缺少 Key）') + '</option>';
      });
      return html;
    }
    redSelect.innerHTML = optionsHtml();
    blackSelect.innerHTML = optionsHtml();
    if (state.models.length) {
      redSelect.value = 'model:' + state.models[0].id;
      blackSelect.value = state.models.length > 1 ? 'model:' + state.models[1].id : 'engine';
    }
  }

  async function loadModels() {
    var data = await api('/api/models');
    state.models = data.models || [];
    state.providers = data.providers || [];
    fillProviderSelect();
    renderModelList();
    fillPlayerSelects();
  }

  function specFor(value) {
    if (value === 'engine') { return { kind: 'engine', depth: 3 }; }
    if (value === 'human') { return { kind: 'human' }; }
    if (value.indexOf('model:') === 0) { return { kind: 'model', model_id: value.slice(6) }; }
    return { kind: 'engine', depth: 3 };
  }

  async function startMatch() {
    var red = specFor(redSelect.value);
    var black = specFor(blackSelect.value);
    var humanSide = null;
    if (red.kind === 'human' && black.kind === 'human') {
      toast('两边不能都是人类。'); return;
    }
    if (red.kind === 'human') { humanSide = 'red'; }
    if (black.kind === 'human') { humanSide = 'black'; }
    var maxPlies = parseInt($('max-plies').value, 10) || 300;
    toast('');
    try {
      await api('/api/new', { method: 'POST', body: { red: red, black: black, human_side: humanSide, max_plies: maxPlies } });
      closeSetup();
      state.selected = null;
      connectEvents();
      refreshState();
    } catch (err) {
      toast(err.message);
    }
  }

  // ------------------------------------------------------------------- events
  function connectEvents() {
    if (state.es) { state.es.close(); }
    var es = new EventSource('/api/events');
    state.es = es;
    es.onmessage = function (event) {
      var data;
      try { data = JSON.parse(event.data); } catch (err) { return; }
      if (data.type === 'state' && data.snapshot) { applySnapshot(data.snapshot); }
      else if (data.type === 'trace' && data.entry) { addTrace(data.entry); }
      else if (data.type === 'end' && data.snapshot) { applySnapshot(data.snapshot); }
    };
  }

  async function refreshState() {
    try {
      var data = await api('/api/state');
      if (data.snapshot) {
        applySnapshot(data.snapshot);
        if (!state.es && !state.staticMode) { connectEvents(); }
      }
    } catch (err) { /* server not ready yet */ }
  }

  // ------------------------------------------------------------------ actions
  function openSetup() {
    toast('');
    $('setup').classList.remove('hidden');
    loadModels().catch(function (err) { toast(err.message); });
  }

  function closeSetup() {
    $('setup').classList.add('hidden');
    toast('');
  }

  function switchTab(name) {
    state.tab = name;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i += 1) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === name);
    }
    ['moves', 'chat', 'trace'].forEach(function (tab) {
      $('pane-' + tab).classList.toggle('active', tab === name);
    });
  }

  async function addModel() {
    var provider = $('add-provider').value;
    var payload = {
      provider: provider,
      model: $('add-model').value.trim(),
      api_key: $('add-key').value.trim(),
      label: $('add-label').value.trim()
    };
    if (provider === 'custom') {
      var base = window.prompt('请输入 OpenAI 兼容接口的 base_url（例如 https://api.example.com/v1）');
      if (!base) { return; }
      payload.base_url = base;
    }
    try {
      var data = await api('/api/models', { method: 'POST', body: payload });
      $('add-key').value = '';
      $('add-label').value = '';
      $('add-result').textContent = '已添加：' + data.model.label + '（记得点“测试”确认可用）';
      $('add-result').className = 'hint';
      await loadModels();
    } catch (err) {
      $('add-result').textContent = err.message;
      $('add-result').className = 'hint error';
    }
  }

  async function testModel(id, slot) {
    slot.textContent = '测试中…';
    slot.className = 'test-slot';
    try {
      var data = await api('/api/models/' + id + '/test', { method: 'POST', body: {} });
      slot.textContent = '可用 · ' + (data.reply || 'ok') + ' · ' + data.seconds + 's';
      slot.className = 'test-ok';
    } catch (err) {
      slot.textContent = '失败：' + err.message;
      slot.className = 'test-bad';
    }
  }

  async function removeModel(id) {
    if (!window.confirm('确定从模型库删除这个模型？')) { return; }
    try {
      await api('/api/models/' + id, { method: 'DELETE' });
      await loadModels();
    } catch (err) { toast(err.message); }
  }

  // --------------------------------------------------------------------- init
  function bindEvents() {
    $('btn-new').addEventListener('click', openSetup);
    $('setup-close').addEventListener('click', closeSetup);
    $('setup').addEventListener('click', function (event) {
      if (event.target === $('setup')) { closeSetup(); }
    });
    $('btn-start').addEventListener('click', startMatch);
    $('btn-add-model').addEventListener('click', addModel);
    $('add-provider').addEventListener('change', updateModelPlaceholder);

    $('model-list').addEventListener('click', function (event) {
      var testId = event.target.getAttribute('data-test');
      if (testId) {
        testModel(testId, event.target.parentElement.parentElement.querySelector('.test-slot'));
        return;
      }
      var delId = event.target.getAttribute('data-del');
      if (delId) { removeModel(delId); }
    });

    $('btn-stop').addEventListener('click', function () {
      api('/api/stop', { method: 'POST', body: {} }).catch(function (err) { toast(err.message); });
    });

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () { switchTab(tab.getAttribute('data-tab')); });
    });

    $('chat-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var input = $('chat-input');
      var text = input.value.trim();
      if (!text) { return; }
      try {
        await api('/api/say', { method: 'POST', body: { text: text } });
        input.value = '';
      } catch (err) { toast(err.message); }
    });

    grid.addEventListener('click', function (event) {
      if (event.target.closest('.piece')) { return; }
      var rect = grid.getBoundingClientRect();
      var x = Math.round((event.clientX - rect.left) / rect.width * 8);
      var y = Math.round((event.clientY - rect.top) / rect.height * 9);
      if (x < 0 || x > 8 || y < 0 || y > 9) { return; }
      handleSquare('abcdefghi'.charAt(x) + y);
    });

    piecesLayer.addEventListener('click', function (event) {
      var el = event.target.closest('.piece');
      if (!el) { return; }
      var snap = state.snapshot;
      if (!snap) { return; }
      var name = el.getAttribute('data-square');
      var legal = (snap.legal || {})[state.selected];
      if (state.selected && legal && legal.indexOf(name) !== -1 && state.selected !== el.getAttribute('data-id')) {
        sendMove(state.selected, name);
        return;
      }
      handleSquare(name);
    });

    window.addEventListener('resize', fitBoard);
  }

  async function init() {
    grid = $('grid');
    piecesLayer = $('pieces');
    markersLayer = $('markers');
    redSelect = $('red-select');
    blackSelect = $('black-select');
    drawGrid();
    bindEvents();
    fitBoard();
    state.staticMode = window.location.search.indexOf('static=1') !== -1;
    await refreshState();
    if (!state.snapshot && !state.staticMode) { openSetup(); }
    var params = new URLSearchParams(window.location.search);
    if (params.get('setup') === '1') { openSetup(); }
    var wantedTab = params.get('tab');
    if (wantedTab === 'chat' || wantedTab === 'trace') { switchTab(wantedTab); }
    if (!state.staticMode) { setInterval(refreshState, 1500); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
