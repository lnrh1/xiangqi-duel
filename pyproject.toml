[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-duel"
version = "0.1.0"
description = "中国象棋 AI 对弈：双 AI 观战、人机对弈、模型库与工具调用"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lnrh1" }]
keywords = ["xiangqi", "chinese-chess", "llm", "agents", "tool-calling", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lnrh1/xiangqi-duel"
Source = "https://github.com/lnrh1/xiangqi-duel"

[project.scripts]
xiangqi-duel = "xiangqi_duel.cli:main"

[tool.setuptools]
packages = ["xiangqi_duel"]

[tool.setuptools.package-data]
xiangqi_duel = ["web/*.html"]
